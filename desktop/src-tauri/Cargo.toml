[package]
name = "northbridge-agentnet-desktop"
version = "0.1.0"
description = "Local-first QM desktop deployment"
authors = ["NorthBridge"]
edition = "2021"

[lib]
name = "northbridge_agentnet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
